name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q "asif-mobile-zone.zip" -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: project
        run: npm install

      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App
        working-directory: project
        run: npm run build

      - name: Initialize Capacitor
        working-directory: project
        run: |
          npx cap init "AMZ SHOP - Asif Mobile Zone" "com.asifmobilezone.shop" --web-dir dist

      - name: Add Android
        working-directory: project
        run: npx cap add android

      - name: Copy Web App
        working-directory: project
        run: npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASIF-MOBILE-ZONE-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
